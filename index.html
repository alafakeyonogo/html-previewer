<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MonaStudio · HTML 编辑</title><link rel="stylesheet" href="./styles.css"><script src="./vendor/purify.min.js"></script><script src="./vendor/html2canvas.min.js"></script></head>
<body>
<main class="canvas-area"><div id="canvas-scroll"><div id="canvas-size"><iframe id="canvas" title="HTML 编辑画布" sandbox="allow-same-origin allow-scripts"></iframe></div></div></main>
<aside class="left-console glass" aria-label="文件与图层">
  <header class="console-heading"><div class="brand"><svg class="mona-logo" viewBox="0 0 52477 35959" aria-label="MonaStudio"><path transform="scale(127.063 127.063)" d="M94.0426 35.6029C104.519 33.9912 117.568 40.1 124.06 47.9726C129.633 54.7303 135.1 62.346 140.27 69.4362L168.854 108.583C174.618 98.5953 180.275 84.1642 189.029 77.0419C198.593 69.3927 209.103 66.9099 221.139 68.2599C235.123 69.8284 243.193 78.857 251.393 89.2891C254.791 93.6116 258.358 97.9356 261.795 102.219C270.492 113.096 279.269 123.909 288.125 134.657C287.899 128.473 288.032 121.461 288.028 115.228C287.999 99.2494 288.149 83.2712 288.478 67.2961C288.603 57.039 287.869 46.3253 288.074 36.0389C299.012 35.8976 310.166 36.0061 321.117 36.0058C332.081 35.9635 343.046 35.9861 354.01 36.0734L353.995 150.072L354.002 189.093C353.997 203.049 355.528 219.391 347.456 231.496C341.951 239.752 332.438 245.556 322.756 247.438C308.857 249.717 295.324 244.993 285.958 234.467C280.931 228.817 276.403 222.8 271.643 216.926L239.989 177.95L229.474 164.915C227.881 162.91 221.45 154.243 219.765 153.961C218.474 154.519 216.666 159.078 215.856 160.506C209.626 171.495 206.636 182.556 196.474 190.831C188.215 197.557 180.233 199.904 169.737 198.953C154.052 197.532 145.787 186.981 137.675 174.917C133.679 169.036 128.637 162.505 124.003 157.1C123.387 186.994 124.102 217.859 123.884 247.864C121.283 247.985 118.552 247.962 115.941 247.939C96.9908 247.77 77.9708 248.185 59.0274 247.908C58.8682 234.415 59.0115 220.611 59.0126 207.097L59.0071 127.931L58.9956 89.6927C58.9951 84.2588 58.928 78.627 59.0375 73.3636C59.3728 57.2385 69.1766 42.3463 84.7702 37.3002C88.0098 36.2518 90.6289 35.9136 94.0426 35.6029Z M94.7886 58.0586C103.992 57.4123 108.163 64.1439 112.938 70.6527L122.381 83.6964L156.115 129.19L166.741 143.633C168.516 146.008 170.467 148.77 172.448 150.941C178.839 139.382 184.534 127.672 190.597 115.958C193.928 109.524 197.599 101.244 202.06 95.7722C204.262 93.0695 210.602 90.0475 214.122 89.9369C218.249 89.8071 222.772 91.5092 225.853 94.2717C231.987 99.7718 236.929 107.309 242.204 113.756L294.217 177.978C297.882 182.414 301.389 187.122 305.101 191.541C306.855 193.629 308.758 196.315 310.791 198.08L310.898 198.173C310.643 192.114 310.896 183.85 310.897 177.648L310.902 136.302L310.897 86.5177C310.897 77.2982 310.713 67.3395 310.997 58.1643C314.109 57.8899 327.76 57.8672 331.009 58.168C331.458 63.3591 331.167 73.4502 331.167 79.0212L331.166 118.678L331.165 177.623C331.171 188.162 331.186 198.695 331.114 209.234C331.055 217.837 327.348 223.73 318.302 225.005C316.8 225.073 315.294 225.059 313.793 224.963C308.396 224.586 305.479 222.693 301.932 218.764C298.822 215.319 296.049 211.668 293.162 208.039L280.876 192.874L236.865 138.513C229.941 129.945 222.584 120.223 215.405 111.961C212.802 115.937 208.992 124.175 206.692 128.754C201.814 138.57 196.817 148.328 191.701 158.023C186.519 167.917 183.267 179.068 169.284 175.746C163.79 174.44 158.026 164.828 154.811 160.415C149.54 153.085 144.218 145.791 138.846 138.534C129.453 126.201 120.198 113.764 111.083 101.224C109.286 98.7301 107.466 96.2531 105.624 93.7929C104.093 91.779 102.31 89.7088 101.062 87.5377C101.208 92.9166 101.051 98.8778 101.051 104.311L101.05 138.831L101.006 224.99C94.5099 225.125 87.7238 225.035 81.2185 224.999C80.975 222.835 80.9729 220.203 81.0111 218.008C81.3573 198.15 81.0077 178.28 81.0042 158.429L80.996 103.704L80.9742 85.9429C80.9627 74.5924 80.0489 60.7217 94.7886 58.0586Z" fill="currentColor" fill-rule="evenodd" stroke="currentColor" stroke-width="3"/></svg><span>MonaStudio</span></div><span class="mode-label">HTML 编辑</span><button type="button" id="close-console" class="icon-button" title="收起文件面板" aria-label="收起文件面板" ><svg class="icon" aria-hidden="true"><use href="./icons.svg#panel-left"/></svg></button></header>
  <div class="import-section">
    <button id="open-file" class="upload-zone"><span class="upload-circle"><svg class="icon" aria-hidden="true"><use href="./icons.svg#upload"/></svg></span><strong>打开 HTML，开始编辑</strong><small>拖入文件，或点击选择</small></button>
    <input id="html-file" type="file" accept=".html,.htm,text/html" hidden>
    <button type="button" id="open-source" class="source-button" ><svg class="icon" aria-hidden="true"><use href="./icons.svg#code"/></svg><span>粘贴 HTML 源码</span></button>
  </div>
  <div class="document-title"><svg class="icon" aria-hidden="true"><use href="./icons.svg#file-code"/></svg><input id="filename" value="我的设计.html" aria-label="文件名"><button type="button" id="document-options" class="icon-button" title="页面设置" aria-label="页面设置" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="./icons.svg#settings-2"/></svg></button></div>
  <div id="document-settings" class="document-settings" hidden><label>画布宽度<select id="canvas-width"><option value="375">375 px</option><option value="768" selected>768 px</option><option value="1024">1024 px</option><option value="1440">1440 px</option></select></label><label>资源基础地址<input id="base-url" type="url" placeholder="https://example.com/path/" aria-label="资源基础地址"></label><button type="button" id="apply-base" class="subtle-button" ><svg class="icon" aria-hidden="true"><use href="./icons.svg#check"/></svg><span>应用资源地址</span></button><p>相对路径图片或样式可使用原页面地址加载。</p><button type="button" id="load-example" class="subtle-button" ><svg class="icon" aria-hidden="true"><use href="./icons.svg#file-code"/></svg><span>打开示例</span></button></div>
  <div class="layers-heading"><h2><svg class="icon" aria-hidden="true"><use href="./icons.svg#layers"/></svg>页面图层</h2><span id="layer-count"></span></div>
  <nav id="layers" aria-label="页面元素"></nav>
  <footer class="console-footer"><span class="status-dot"></span><span id="status" role="status">正在打开编辑器…</span></footer>
</aside>
<div class="top-actions glass"><button type="button" id="toggle-console" class="icon-button" title="文件与图层" aria-label="文件与图层" aria-expanded="true"><svg class="icon" aria-hidden="true"><use href="./icons.svg#panel-left"/></svg></button><button type="button" id="edit-source" class="" ><svg class="icon" aria-hidden="true"><use href="./icons.svg#code"/></svg><span>编辑源码</span></button><span class="separator"></span><button id="preview" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="./icons.svg#eye"/></svg><span id="preview-label">预览</span></button></div>
<div class="canvas-hint" id="empty-selection">点击选择元素，双击修改文字</div>
<aside class="inspector glass" hidden aria-label="样式属性">
  <header class="panel-heading"><h2><svg class="icon" aria-hidden="true"><use href="./icons.svg#sliders-horizontal"/></svg>样式调整</h2><span id="selection-label"></span><button type="button" id="deselect" class="icon-button" title="取消选择" aria-label="取消选择" ><svg class="icon" aria-hidden="true"><use href="./icons.svg#x"/></svg></button></header>
  <form id="properties" hidden onsubmit="return false">
    <section id="text-section"><h3><svg class="icon" aria-hidden="true"><use href="./icons.svg#type"/></svg>文字</h3><label id="text-field" class="text-field"><textarea id="element-text" rows="2" aria-label="内容"></textarea></label><p id="nested-text-hint" class="panel-hint" hidden>双击画布中的文字，直接编辑</p><div class="property-row"><label for="value-font-size">字号</label><div class="slider-control"><input type="range" data-range="font-size" min="10" max="120" aria-label="字号滑杆"><input id="value-font-size" data-style="font-size" aria-label="字号" placeholder="0px"></div></div><div class="property-row"><label for="value-color">文字颜色</label><div class="color-control"><input type="color" data-color="color" aria-label="文字颜色选择器"><input id="value-color" data-style="color" aria-label="文字颜色"></div></div><div class="property-row"><label for="font-weight">字重</label><select id="font-weight" data-style="font-weight"><option value="400">常规</option><option value="500">中等</option><option value="600">半粗</option><option value="700">粗体</option><option value="800">特粗</option><option value="900">黑体</option></select></div></section>
    <section id="image-section" hidden><h3><svg class="icon" aria-hidden="true"><use href="./icons.svg#image"/></svg>图片替换</h3><button type="button" id="replace-image" class="replace-zone"><svg class="icon" aria-hidden="true"><use href="./icons.svg#upload"/></svg><strong>点击或拖入图片替换</strong><small>PNG / JPG / WebP</small></button><input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" hidden><div class="property-row"><label for="image-fit">填充方式</label><select id="image-fit" data-style="object-fit"><option value="cover">填满裁切</option><option value="contain">完整显示</option><option value="fill">拉伸填满</option><option value="none">原始尺寸</option><option value="scale-down">缩小适应</option></select></div><div class="property-row"><label for="image-scale-value">图片缩放</label><div class="slider-control"><input id="image-scale" type="range" min="10" max="500" step="1" value="100" aria-label="图片缩放滑杆"><div class="scale-number"><input id="image-scale-value" type="number" min="10" max="500" step="1" value="100" aria-label="图片缩放百分比"><span>%</span></div></div></div><div class="property-row"><label for="image-x">水平位置</label><input id="image-x" type="range" min="0" max="100" data-position="0"></div><div class="property-row"><label for="image-y">垂直位置</label><input id="image-y" type="range" min="0" max="100" data-position="1"></div></section>
    <section><h3><svg class="icon" aria-hidden="true"><use href="./icons.svg#square"/></svg>外观</h3><div class="property-row"><label for="value-background-color">背景颜色</label><div class="color-control"><input type="color" data-color="background-color" aria-label="背景颜色选择器"><input id="value-background-color" data-style="background-color" aria-label="背景颜色"></div></div><div class="property-row"><label for="value-border-radius">圆角</label><div class="slider-control"><input type="range" data-range="border-radius" min="0" max="100" aria-label="圆角滑杆"><input id="value-border-radius" data-style="border-radius" aria-label="圆角" placeholder="0px"></div></div><div class="property-row"><label for="value-padding">内边距</label><div class="slider-control"><input type="range" data-range="padding" min="0" max="100" aria-label="内边距滑杆"><input id="value-padding" data-style="padding" aria-label="内边距" placeholder="0px"></div></div></section>
    <section><h3><svg class="icon" aria-hidden="true"><use href="./icons.svg#move"/></svg>尺寸</h3><div class="property-row"><label for="value-width">宽度</label><div class="slider-control"><input type="range" data-range="width" min="0" max="1500" aria-label="宽度滑杆"><input id="value-width" data-style="width" aria-label="宽度" placeholder="0px"></div></div><div class="property-row"><label for="value-height">高度</label><div class="slider-control"><input type="range" data-range="height" min="0" max="1500" aria-label="高度滑杆"><input id="value-height" data-style="height" aria-label="高度" placeholder="0px"></div></div></section>
    <details class="advanced"><summary>更多属性<svg class="icon" aria-hidden="true"><use href="./icons.svg#chevron-down"/></svg></summary><div class="advanced-fields"><label>行高<input data-style="line-height" placeholder="1.5"></label><label>字间距<input data-style="letter-spacing" placeholder="0px"></label><label>对齐<select data-style="text-align"><option value="start">默认</option><option value="left">左对齐</option><option value="center">居中</option><option value="right">右对齐</option><option value="justify">两端对齐</option></select></label><label>透明度<input data-style="opacity" type="number" min="0" max="1" step="0.05"></label><label>外边距<input data-style="margin" placeholder="0px"></label><label>图片位置<input data-style="object-position" placeholder="50% 50%"></label><label>图片地址<input id="image-url" placeholder="https://…"></label><label>替代文字<input id="image-alt"></label></div></details>
    <div class="element-actions"><button type="button" id="select-parent" class="icon-button" title="选择父元素" aria-label="选择父元素" ><svg class="icon" aria-hidden="true"><use href="./icons.svg#corner-left-up"/></svg></button><button type="button" id="duplicate" class="icon-button" title="复制元素" aria-label="复制元素" ><svg class="icon" aria-hidden="true"><use href="./icons.svg#copy"/></svg></button><button type="button" id="delete-element" class="icon-button" title="删除元素" aria-label="删除元素" ><svg class="icon" aria-hidden="true"><use href="./icons.svg#trash-2"/></svg></button><button type="button" id="reset-element" class="icon-button" title="恢复原始样式" aria-label="恢复原始样式" ><svg class="icon" aria-hidden="true"><use href="./icons.svg#rotate-ccw"/></svg></button></div>
  </form>
</aside>
<div class="action-island glass">
  <button type="button" id="zoom-out" class="icon-button" title="缩小" aria-label="缩小" ><svg class="icon" aria-hidden="true"><use href="./icons.svg#minus"/></svg></button><button id="zoom-reset" class="zoom-value" title="恢复 100%"><span id="zoom-value">75%</span></button><button type="button" id="zoom-in" class="icon-button" title="放大" aria-label="放大" ><svg class="icon" aria-hidden="true"><use href="./icons.svg#plus"/></svg></button><input id="zoom" type="hidden" value="0.75">
  <span class="separator"></span><button type="button" id="undo" class="icon-button" title="撤销" aria-label="撤销" disabled><svg class="icon" aria-hidden="true"><use href="./icons.svg#undo-2"/></svg></button><button type="button" id="redo" class="icon-button" title="重做" aria-label="重做" disabled><svg class="icon" aria-hidden="true"><use href="./icons.svg#redo-2"/></svg></button><span class="separator"></span>
  <button type="button" id="export-html" aria-label="保存 HTML" class="save-button" ><svg class="icon" aria-hidden="true"><use href="./icons.svg#save"/></svg><span>保存 HTML</span></button><button type="button" id="export-image" class="primary" ><svg class="icon" aria-hidden="true"><use href="./icons.svg#download"/></svg><span>导出图片</span></button>
</div>
<dialog id="source-dialog"><form method="dialog" class="dialog-heading"><div><h2>HTML 源码</h2><p>粘贴完整页面或 HTML 片段，即可在画布中编辑</p></div><button class="icon-button" aria-label="关闭源码窗口"><svg class="icon" aria-hidden="true"><use href="./icons.svg#x"/></svg></button></form><textarea id="source" spellcheck="false" aria-label="HTML 源码"></textarea><div class="dialog-actions"><span>修改后可撤销</span><button type="button" id="apply-source" class="primary" ><svg class="icon" aria-hidden="true"><use href="./icons.svg#check"/></svg><span>应用到画布</span></button></div></dialog>
<script type="module" src="./app.js"></script>
</body></html>
